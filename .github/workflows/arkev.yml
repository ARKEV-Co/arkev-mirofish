name: ARKEV
on:
  push:
    branches: [main, "arkev/**"]
  pull_request:

jobs:
  proxy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Claude proxy tests
        run: pytest -q claude-proxy/tests

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The backend and the proxy images build
        run: |
          docker build -f Dockerfile.backend -t arkev-mirofish:ci .
          docker build -t arkev-claude-proxy:ci claude-proxy
      - name: The backend imports and needs its token
        run: |
          docker run --rm --entrypoint python -e MIROFISH_API_TOKEN=t -e NEO4J_URI=bolt://127.0.0.1:1 -e LLM_API_KEY=x arkev-mirofish:ci -c "
          from app import create_app
          app = create_app(); c = app.test_client()
          assert c.get('/health').status_code == 200
          assert c.get('/api/simulation/list').status_code == 401
          print('ok')"
          docker run --rm --entrypoint claude arkev-claude-proxy:ci --version
      - name: Secrets come from files (the server's convention)
        run: |
          mkdir -p s && echo -n proxy-k > s/proxy_key && echo -n api-t > s/api_token && echo -n neo4j/pw-x > s/neo4j_auth
          sudo chown -R 10020 s
          docker run --rm --entrypoint python -v "$PWD/s:/run/secrets:ro" -e LLM_API_KEY_FILE=/run/secrets/proxy_key \
            -e NEO4J_AUTH_FILE=/run/secrets/neo4j_auth -e MIROFISH_API_TOKEN_FILE=/run/secrets/api_token -e NEO4J_URI=bolt://127.0.0.1:1 \
            arkev-mirofish:ci -c "
          import os
          from app.config import Config
          from app import create_app
          assert os.environ['OPENAI_API_KEY'] == 'proxy-k' and Config.LLM_API_KEY == 'proxy-k'
          assert Config.NEO4J_PASSWORD == 'pw-x' and Config.NEO4J_USER == 'neo4j'
          c = create_app().test_client()
          assert c.get('/api/simulation/list').status_code == 401
          print('secret files ok')"

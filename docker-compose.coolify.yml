# ARKEV's MiroFish on Coolify (Docker Compose build pack).
# Coolify: Base Directory "/", Docker Compose Location "/docker-compose.coolify.yml".
#
# Idea Lab's simulation engine. Nothing is published: ARKEV Core reaches the API at
# http://arkev-mirofish:5001 on the coolify network, with MIROFISH_API_TOKEN as a Bearer token.
#
#   mirofish      MiroFish's backend (graph building, OASIS social simulations, reports, interviews)
#   claude-proxy  OpenAI-style API answered by the Claude Code CLI on the owner's subscription
#                 (CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token`; never an API key)
#   neo4j         the memory graph (instead of Zep Cloud: nothing leaves the server)
#   ollama        embeddings only (nomic-embed-text, CPU); no chat model runs here
#
# Coolify environment (typed in Coolify's UI, never committed):
#   CLAUDE_CODE_OAUTH_TOKEN   the owner's subscription token (valid one year)
#   MIROFISH_API_TOKEN        random; Core sends it (set the same value in arkev-core)
#   MIROFISH_PROXY_KEY        random; MiroFish -> claude-proxy
#   MIROFISH_NEO4J_PASSWORD   random
services:
  mirofish:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      - LLM_API_KEY=${MIROFISH_PROXY_KEY}
      - LLM_BASE_URL=http://claude-proxy:8082/v1
      - LLM_MODEL_NAME=claude-sonnet-5-5
      # OASIS / CAMEL-AI (the simulated people) use the same proxy.
      - OPENAI_API_KEY=${MIROFISH_PROXY_KEY}
      - OPENAI_API_BASE_URL=http://claude-proxy:8082/v1
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${MIROFISH_NEO4J_PASSWORD}
      - EMBEDDING_MODEL=nomic-embed-text
      - EMBEDDING_BASE_URL=http://ollama:11434
      - MIROFISH_API_TOKEN=${MIROFISH_API_TOKEN}
    volumes:
      - mirofish-uploads:/app/backend/uploads
    depends_on:
      neo4j:
        condition: service_healthy
      claude-proxy:
        condition: service_started
      ollama:
        condition: service_started
    mem_limit: 6g
    networks:
      default: {}
      coolify:
        aliases:
          - arkev-mirofish

  claude-proxy:
    build:
      context: claude-proxy
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - PROXY_API_KEY=${MIROFISH_PROXY_KEY}
      - PROXY_MODEL=claude-sonnet-5-5
      # Claude calls at once; the subscription has usage limits, the rest wait in line.
      - PROXY_MAX_CONCURRENT=3
    mem_limit: 2g

  neo4j:
    image: neo4j:5.18-community
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${MIROFISH_NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2g
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 3g

  ollama:
    image: ollama/ollama:0.40.2
    restart: unless-stopped
    # Embeddings only: serve, and pull the embedding model once (kept in the volume).
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; ollama pull nomic-embed-text; wait"]
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 2g

volumes:
  mirofish-uploads: {}
  neo4j-data: {}
  ollama-models: {}

networks:
  coolify:
    external: true
